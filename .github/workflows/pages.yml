name: pages

on:
  # `main` is the deploy branch: the github-pages environment only accepts
  # deployments built from it (that is GitHub's default branch policy, not ours).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: audit + assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static audit (scripts, ids, entities, emoji, meta)
        run: node scripts/verify.mjs

      - name: Is Pages enabled?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "Pages is enabled."
          else
            echo "::error title=Enable GitHub Pages once::Open https://github.com/${{ github.repository }}/settings/pages and set Source = GitHub Actions. The token available inside Actions cannot create a Pages site, so this one switch has to be flipped by a human. Everything else is already wired: re-run this workflow (or push) and the site deploys itself."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html app.html _site/
          cp -R assets _site/assets
          printf '' > _site/.nojekyll

          # Stamp the build id. index.html ships v1.1.0+build.__BUILD__ and the
          # deployed copy carries the real commit, so the number a visitor sees
          # always names the artefact they are actually reading. Keeping it out
          # of the source avoids a commit that has to contain its own hash.
          STAMP="$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)"
          sed -i "s/__BUILD__/${STAMP}/g" _site/index.html
          echo "build stamp: ${STAMP}"
          grep -o 'v[0-9.]*+build\.[0-9]*\.[0-9a-f]*' _site/index.html

          find _site -type f | sort | xargs ls -lh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to github pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
